name: Publish to v2.1.x-deployment-2
on:
  workflow_run:
    workflows: ["CI"] # runs after CI workflow
    branches: ["v2.1.x"]
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Push
    steps:
      - if: github.event.workflow_run.conclusion != 'success'
        run: |
          echo "CI step didn't pass, exiting"
          exit 1
          
      - name: Set variables
        id: variables
        shell: bash
        run: |
          echo "target-branch=v2.1.x-deployment-2" >> "$GITHUB_OUTPUT"
          echo "src-branch=v2.1.x" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.variables.outputs.src-branch }}
    
      - name: Unshallow repository
        run: git fetch --unshallow origin ${{ steps.variables.outputs.src-branch }}

      - name: Get last successful commit
        id: last-successful-commit
        uses: nickderobertis/last-successful-commit-action@v1
        with:
          workflow-id: publish-v2.1.x.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.variables.outputs.src-branch }}

      - name: Get commit count
        id: commit-count
        shell: bash
        run: |
          echo "Deploying $(git rev-list --count ${{ steps.last-successful-commit.outputs.commit-sha }}..${{ github.sha }}) commits!"
          echo "commit-count=$(git rev-list --count ${{ steps.last-successful-commit.outputs.commit-sha }}..${{ github.sha }})" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # Optimiert: PNPM Setup nutzt jetzt automatisch das interne Caching
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9.1
          run_install: false

      # Next.js Cache: Restore mit stabilen Keys
      - uses: actions/cache/restore@v4
        name: Restore Next.js cache
        id: cache-nextjs-restore
        with:
          path: src/build/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install all dependencies
        working-directory: ./src
        run: pnpm install --no-frozen-lockfile

      - name: Build
        working-directory: ./src
        run: pnpm build
      
      - name: Build cli
        working-directory: ./src
        run: pnpm build:cli

      # Next.js Cache: Save mit explizitem Key (behebt die "Unable to reserve cache" Warnung)
      - uses: actions/cache/save@v4
        name: Save Next.js cache
        if: always()
        with:
          path: src/build/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx') }}

      - name: Delete files not needed in deployment
        working-directory: ./src
        run: rm -rf __tests__ app pages components coverage data helpers hooks moonraker env recoil server utils zods test-setup.ts test-setup-global.ts vitest.config.mts tsconfig.vitest.json copy-files-from-to.json components.json postcss.config.js prettier.config.mjs tailwind.config.ts

      - name: Rename src/ to app/
        run: mv src app

      - name: Modify .env file to fix paths pointing to src/
        working-directory: ./app
        run: |
          sed -i 's|/src/scripts|/app/scripts|g' .env

      - name: Publish to ${{ steps.variables.outputs.target-branch }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          commit-message: |
            Deployed ${{ steps.commit-count.outputs.commit-count }} commit${{ steps.commit-count.outputs.commit-count > 1 && 's' || '' }}.
            
            https://github.com/Rat-OS/RatOS-configurator/compare/${{ steps.last-successful-commit.outputs.commit-sha }}...${{ github.sha }}
          git-config-name: github-actions[bot]
          git-config-email: 41898282+github-actions[bot]@users.noreply.github.com
          branch: ${{ steps.variables.outputs.target-branch }}

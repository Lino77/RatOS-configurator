name: "Test Report"
on:
  workflow_run:
    workflows: ["CI"] # runs after CI workflow
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

# Erzwingt die Node.js 24 Laufzeit
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@v6 # Aktualisiert von v3 auf v6
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: test-results
          if_no_artifact_found: fail

      - name: Annotate ESLint
        uses: ataylorme/eslint-annotate-action@v3 # Aktualisiert von v2 auf v3

      - name: Test Report
        uses: dorny/test-reporter@v3 # Aktualisiert von v1 auf v3
        with:
          artifact: test-results
          name: Test Report
          path: "*.xml"
          reporter: jest-junit

